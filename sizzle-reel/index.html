<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeremy Cointin Sizzle Reel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-family: Inter, sans-serif; color: #ccc; }
  canvas { width: min(100vw, calc(100vh * 16 / 9 - 60px)); aspect-ratio: 16 / 9; display: block; }
  #ui { display: flex; gap: 12px; align-items: center; }
  #ui button { background: #22D3EE; border: 0; padding: 8px 18px; font-weight: 700; border-radius: 6px; cursor: pointer; }
  body.render #ui { display: none; }
  body.render canvas { width: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play">Play with sound</button><span id="clock">0.0s</span></div>
<audio id="music" src="music.wav" preload="auto"></audio>
<script>
'use strict';
const W = 1920, H = 1080, DURATION = 100;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = {
  bg: '#060A18', bg2: '#0D1430', cyan: '#22D3EE', orange: '#FF7A2F', pink: '#FF3D7F',
  white: '#F3F6FB', dim: '#8A94B8', green: '#34D399', purple: '#8B5CF6', yellow: '#FFD23F'
};
const DISP = '"Inter Display", Inter, sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

const photo = new Image();
photo.src = 'assets/jeremy_cut.png';

// ---------- math helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- drawing helpers ----------
function font(size, weight = 800, family = DISP, ls = 0) {
  ctx.font = `${weight} ${size}px ${family}`;
  ctx.letterSpacing = ls + 'px';
}
function text(str, x, y, o = {}) {
  ctx.save();
  font(o.size || 64, o.weight || 800, o.font || DISP, o.ls || 0);
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowSize || 30; }
  if (o.stroke) { ctx.lineWidth = o.lineWidth || 3; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  if (o.color !== 'none') { ctx.fillStyle = o.color || C.white; ctx.fillText(str, x, y); }
  ctx.restore();
}
function measure(str, size, weight = 800, family = DISP, ls = 0) {
  ctx.save(); font(size, weight, family, ls); const w = ctx.measureText(str).width; ctx.restore(); return w;
}
// Word-by-word rising reveal. colors: optional array of per-word colors.
function reveal(str, x, y, lt, start, o = {}) {
  const size = o.size || 64, weight = o.weight || 800, fam = o.font || DISP, ls = o.ls || 0;
  const stagger = o.stagger ?? 0.06, dur = o.dur ?? 0.55, dy = o.dy ?? size * 0.5;
  ctx.save();
  font(size, weight, fam, ls);
  const words = str.split(' ');
  const space = ctx.measureText(' ').width;
  const widths = words.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  ctx.textAlign = 'left';
  words.forEach((w, i) => {
    const k = eOut(p(lt, start + i * stagger, start + i * stagger + dur));
    if (k > 0) {
      ctx.save();
      ctx.globalAlpha *= k * (o.alpha ?? 1);
      if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 30; }
      ctx.fillStyle = (o.colors && o.colors[i]) || o.color || C.white;
      ctx.fillText(w, cx, y + (1 - k) * dy);
      ctx.restore();
    }
    cx += widths[i] + space;
  });
  ctx.restore();
  return total;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glowDot(x, y, r, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, color); g.addColorStop(0.25, color + '88'); g.addColorStop(1, color + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function label(str, x, y, color = C.cyan, a = 1) {
  text(str, x, y, { size: 26, weight: 700, font: MONO, color, ls: 6, alpha: a });
}
function chip(str, x, y, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  font(26, 600, MONO, 1);
  const w = ctx.measureText(str).width + 44;
  rrect(x, y - 34, w, 50, 25);
  ctx.fillStyle = color + '22'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(str, x + 22, y - 8);
  ctx.restore();
  return w;
}
function drawPhoto(cx, bottom, h, a = 1) {
  if (!photo.complete || !photo.naturalWidth) return;
  ctx.save(); ctx.globalAlpha *= a;
  const s = h / 674; // subject spans y 26..700 in the source
  const w = photo.naturalWidth * s;
  // subject's horizontal center is ~357px in the 700px source
  ctx.drawImage(photo, cx - 357 * s, bottom - 700 * s, w, 700 * s);
  ctx.restore();
}

// ---------- background ----------
const parts = (() => { const r = rng(7); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: 0.5 + r() * 2.2, v: 6 + r() * 22, ph: r() * 6.28 })); })();
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#040712'); g.addColorStop(0.6, C.bg); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // drifting color blobs
  const blob = (x, y, r, col, a) => { const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, col.slice(0, 7) + '00'); ctx.globalAlpha = a; ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; };
  blob(W * 0.15 + Math.sin(t * 0.21) * 160, H * 0.2 + Math.cos(t * 0.17) * 90, 700, '#1B3A8A', 0.35);
  blob(W * 0.85 + Math.cos(t * 0.19) * 160, H * 0.8 + Math.sin(t * 0.23) * 90, 650, '#7A2A5E', 0.25);
  // perspective grid floor
  ctx.save();
  ctx.strokeStyle = 'rgba(34,211,238,0.10)'; ctx.lineWidth = 1.5;
  const horizon = H * 0.62, vx = W / 2;
  for (let i = -16; i <= 16; i++) { ctx.beginPath(); ctx.moveTo(vx + i * 40, horizon); ctx.lineTo(vx + i * 260, H); ctx.stroke(); }
  const off = (t * 0.6) % 1;
  for (let i = 0; i < 12; i++) { const k = Math.pow((i + off) / 12, 2.2); const y = horizon + (H - horizon) * k; ctx.globalAlpha = k; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  const fade = ctx.createLinearGradient(0, horizon - 10, 0, horizon + 140);
  fade.addColorStop(0, C.bg); fade.addColorStop(1, 'rgba(6,10,24,0)');
  ctx.fillStyle = fade; ctx.fillRect(0, horizon - 10, W, 150);
  // particles
  for (const q of parts) {
    const y = ((q.y - t * q.v) % H + H) % H;
    ctx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 2 + q.ph);
    ctx.fillStyle = q.s > 2 ? C.orange : C.cyan;
    ctx.fillRect(q.x + Math.sin(t * 0.5 + q.ph) * 20, y, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// =====================================================================
// SCENES — times in seconds; 120 BPM so every cut lands on a bar (2s)
// =====================================================================

// 1. Boot + title slam
function sIntro(lt) {
  const termA = 1 - p(lt, 2.5, 2.8);
  if (termA > 0) {
    ctx.save(); ctx.globalAlpha = termA;
    const x = 560, y0 = 420, lh = 62;
    const type = (s, a, b) => s.slice(0, Math.floor(s.length * p(lt, a, b)));
    const cursor = Math.floor(lt * 4) % 2 ? '' : '█';
    text('$ ' + type('whoami', 0.15, 0.55), x, y0, { size: 40, font: MONO, weight: 400, color: C.cyan });
    if (lt > 0.65) text('jeremy_cointin', x, y0 + lh, { size: 40, font: MONO, weight: 400, color: C.white });
    if (lt > 0.85) text('$ ' + type('npm run sizzle-reel', 0.85, 1.4), x, y0 + lh * 2, { size: 40, font: MONO, weight: 400, color: C.cyan });
    if (lt > 1.5) {
      text('▸ compiling 14 years of code…', x, y0 + lh * 3, { size: 40, font: MONO, weight: 400, color: C.orange });
      const k = eInOut(p(lt, 1.6, 2.4));
      ctx.strokeStyle = C.dim; ctx.lineWidth = 2; ctx.strokeRect(x, y0 + lh * 3 + 30, 800, 26);
      ctx.fillStyle = C.orange; ctx.fillRect(x + 4, y0 + lh * 3 + 34, 792 * k, 18);
      text(Math.round(k * 100) + '%', x + 820, y0 + lh * 3 + 52, { size: 30, font: MONO, weight: 400, color: C.white });
    } else if (lt < 1.5) {
      text(cursor, x + measure('$ npm run sizzle-reel', 40, 400, MONO) + 8, y0 + lh * (lt > 0.85 ? 2 : 0), { size: 40, font: MONO, weight: 400, color: C.cyan });
    }
    ctx.restore();
  }
  if (lt < 2.8) return;
  const t2 = lt - 2.8;
  // title letters slam in
  const slam = (word, y, size, color, start) => {
    font(size, 900, DISP, 8);
    const letters = word.split('');
    const widths = letters.map(l => ctx.measureText(l).width);
    const total = widths.reduce((a, b) => a + b, 0);
    let x = W / 2 - total / 2;
    letters.forEach((l, i) => {
      const k = p(t2, start + i * 0.045, start + i * 0.045 + 0.35);
      if (k > 0) {
        const s = lerp(2.6, 1, eOutExpo(k));
        ctx.save();
        ctx.translate(x + widths[i] / 2, y);
        ctx.scale(s, s);
        ctx.globalAlpha = clamp(k * 3);
        font(size, 900, DISP, 8);
        ctx.textAlign = 'center';
        if (t2 < 0.9) { // chromatic split during the slam
          const d = (1 - p(t2, 0.3, 0.9)) * 10;
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = 'rgba(255,61,127,0.7)'; ctx.fillText(l, -d, 0);
          ctx.fillStyle = 'rgba(34,211,238,0.7)'; ctx.fillText(l, d, 0);
          ctx.globalCompositeOperation = 'source-over';
        }
        ctx.fillStyle = color; ctx.fillText(l, 0, 0);
        ctx.restore();
      }
      x += widths[i];
    });
  };
  const drift = Math.max(0, t2 - 1) * 4;
  ctx.save(); ctx.translate(0, -drift);
  slam('JEREMY', 500, 230, C.white, 0.0);
  slam('COINTIN', 720, 230, C.orange, 0.2);
  ctx.restore();
  const k = eOut(p(t2, 1.0, 1.6));
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = C.cyan; ctx.fillRect(W / 2 - 420 * k, 790 - drift, 840 * k, 3);
  ctx.restore();
  reveal('WEB DEVELOPER  ·  IDEA MACHINE  ·  AI WORKFLOW BUILDER', W / 2, 870 - drift, t2, 1.2, { size: 34, weight: 700, font: MONO, color: C.cyan, align: 'center', ls: 4, stagger: 0.08 });
  // impact flash
  const fl = 1 - p(t2, 0, 0.35);
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.55})`; ctx.fillRect(0, 0, W, H); }
}

// 2. Photo + who
function sWho(lt) {
  const k = eOut(p(lt, 0, 0.9));
  const cx = lerp(2200, 1390, k), zoom = 1 + lt * 0.012;
  // halo
  ctx.save();
  const g = ctx.createRadialGradient(1390, 520, 50, 1390, 520, 520);
  g.addColorStop(0, 'rgba(255,122,47,0.45)'); g.addColorStop(0.5, 'rgba(34,211,238,0.12)'); g.addColorStop(1, 'rgba(34,211,238,0)');
  ctx.globalAlpha = k; ctx.fillStyle = g; ctx.fillRect(800, 0, 1120, H);
  ctx.translate(1390, 520); ctx.rotate(lt * 0.25);
  ctx.strokeStyle = 'rgba(34,211,238,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([24, 18]);
  ctx.beginPath(); ctx.arc(0, 0, 400, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(-lt * 0.6); ctx.strokeStyle = 'rgba(255,122,47,0.5)'; ctx.setLineDash([4, 14]);
  ctx.beginPath(); ctx.arc(0, 0, 450, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  drawPhoto(cx, 1080 + 20, 980 * zoom, k);
  label('// HELLO, WORLD', 140, 250, C.cyan, eOut(p(lt, 0.3, 0.8)));
  reveal("I'm Jeremy.", 140, 380, lt, 0.4, { size: 130, weight: 900 });
  reveal('A St. Louis web developer', 140, 470, lt, 0.9, { size: 54, weight: 600, color: C.dim });
  reveal('who has been shipping', 140, 540, lt, 1.2, { size: 54, weight: 600, color: C.dim });
  reveal('since 2012.', 140, 610, lt, 1.5, { size: 54, weight: 700, color: C.white });
  const yrs = Math.round(lerp(0, 14, eOut(p(lt, 2.6, 4.0))));
  if (lt > 2.6) {
    text(String(yrs), 140, 830, { size: 220, weight: 900, color: C.orange, alpha: p(lt, 2.6, 2.9), glow: 'rgba(255,122,47,0.5)' });
    reveal('YEARS', 140 + measure('14', 220, 900) + 30, 740, lt, 3.0, { size: 44, weight: 800, font: MONO, color: C.white, ls: 8 });
    reveal('of real-world code.', 140 + measure('14', 220, 900) + 30, 810, lt, 3.2, { size: 44, weight: 600, color: C.dim });
  }
  reveal('Self-taught. Stack Overflow & W3Schools were my university.', 140, 930, lt, 4.6, { size: 34, weight: 500, color: C.cyan, stagger: 0.04 });
}

// 3. Timeline
function sJourney(lt) {
  label('// THE JOURNEY', 140, 170, C.cyan, eOut(p(lt, 0, 0.4)));
  reveal('From lead dev to a studio of one.', 140, 270, lt, 0.1, { size: 84, weight: 900 });
  const x0 = 200, x1 = 1720, y = 610;
  const k = eInOut(p(lt, 0.6, 6.2));
  ctx.save();
  ctx.strokeStyle = 'rgba(138,148,184,0.35)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  const lg = ctx.createLinearGradient(x0, 0, x1, 0); lg.addColorStop(0, C.cyan); lg.addColorStop(1, C.orange);
  ctx.strokeStyle = lg; ctx.lineWidth = 6; ctx.shadowColor = C.cyan; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, k), y); ctx.stroke();
  ctx.restore();
  glowDot(lerp(x0, x1, k), y, 10, C.white, p(lt, 0.6, 0.8) * (1 - p(lt, 6.2, 6.6)));
  const stops = [
    { f: 0.0, year: '2009', title: 'Taught myself to code', sub: 'Stack Overflow + W3Schools', up: true, col: C.cyan },
    { f: 0.33, year: '2012', title: 'Lead Developer · Studio 2108', sub: '5 years · Great Forest Park Balloon Race', up: false, col: C.cyan },
    { f: 0.66, year: '2017', title: 'Launched STL CodeScape', sub: 'Freelance dev for agencies across STL', up: true, col: C.orange },
    { f: 1.0, year: 'NEXT', title: 'Your team?', sub: "Let's talk.", up: false, col: C.orange },
  ];
  stops.forEach((s, i) => {
    const sx = lerp(x0, x1, s.f);
    const a = eBack(p(k, s.f - 0.02, s.f + 0.08));
    if (k < s.f - 0.02) return;
    ctx.save();
    ctx.fillStyle = C.bg; ctx.strokeStyle = s.col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sx, y, 20 * a, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (i === 3) { ctx.globalAlpha = 0.5 * (1 - (lt * 1.2 % 1)); ctx.beginPath(); ctx.arc(sx, y, 20 + (lt * 1.2 % 1) * 40, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    const al = clamp(a);
    const dir = s.up ? -1 : 1;
    const align = i === 0 ? 'left' : i === 3 ? 'right' : 'center';
    const tx = i === 0 ? sx - 20 : i === 3 ? sx + 20 : sx;
    const base = y + dir * (s.up ? 70 : 110) + (1 - al) * 30 * dir;
    text(s.year, tx, base + (s.up ? -110 : 0), { size: 64, weight: 900, color: s.col, align, alpha: al });
    text(s.title, tx, base + (s.up ? -50 : 60), { size: 36, weight: 700, color: C.white, align, alpha: al });
    text(s.sub, tx, base + (s.up ? 0 : 108), { size: 28, weight: 500, color: C.dim, align, alpha: al });
  });
}

// 4. Track record
function sRecord(lt) {
  label('// THE TRACK RECORD', 140, 170, C.cyan, eOut(p(lt, 0, 0.4)));
  reveal('Trusted by the agencies behind the brands.', 140, 270, lt, 0.1, { size: 76, weight: 900, stagger: 0.05 });
  const stats = [
    { n: 80, suf: '+', l1: 'websites built', l2: '& maintained', col: C.orange },
    { n: 40, suf: '+', l1: 'custom WordPress themes', l2: 'for a single agency', col: C.cyan },
    { n: 10, suf: '', l1: 'agencies & studios', l2: 'on the client list', col: C.pink },
  ];
  stats.forEach((s, i) => {
    const x = 140 + i * 580, st = 0.5 + i * 0.25;
    const a = eOut(p(lt, st, st + 0.5));
    if (a <= 0) return;
    const n = Math.round(s.n * eOut(p(lt, st, st + 1.6)));
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = s.col; ctx.fillRect(x, 360, 6, 250 * a);
    ctx.restore();
    text(n + s.suf, x + 40, 520 + (1 - a) * 40, { size: 170, weight: 900, color: s.col, alpha: a });
    text(s.l1, x + 44, 570, { size: 34, weight: 700, alpha: a });
    text(s.l2, x + 44, 612, { size: 34, weight: 500, color: C.dim, alpha: a });
  });
  // tickers
  const a = eOut(p(lt, 1.6, 2.4));
  const row = (items, y, speed, o) => {
    ctx.save(); ctx.globalAlpha = a;
    font(o.size, o.weight, o.font, o.ls || 0);
    const sep = '   ✦   ';
    const str = items.join(sep) + sep;
    const w = ctx.measureText(str).width;
    let x = -((lt * speed) % w + w) % w;
    if (speed < 0) x = ((lt * -speed) % w) - w;
    ctx.fillStyle = o.color;
    for (; x < W; x += w) ctx.fillText(str, x, y);
    ctx.restore();
  };
  ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.globalAlpha = a; ctx.fillRect(0, 700, W, 250); ctx.restore();
  row(['Spoke Marketing', 'Elasticity', 'Verve Marketing Group', 'Lelander', 'Steady Rain', 'Werremeyer', 'BlankFactor', 'Digital Strike', 'RaisingSails', 'Studio 2108'], 800, 140, { size: 56, weight: 800, font: DISP, color: C.white });
  row(['husk.com', 'medibeacon.com', 'dynaquip.com', 'watercop.com', 'goelastic.com', 'broilmaster.com', 'skicamp.com', 'terrasource.com', 'pretiumpkg.com', 'flylouisville.com', 'copeplastics.com', 'simeiosolutions.com'], 900, -110, { size: 38, weight: 400, font: MONO, color: C.cyan });
}

// 5. Toolkit + wireframe
function sToolkit(lt) {
  label('// THE TOOLKIT', 140, 170, C.cyan, eOut(p(lt, 0, 0.4)));
  reveal('Custom WordPress. Private plugins.', 140, 270, lt, 0.1, { size: 72, weight: 900, stagger: 0.05 });
  reveal('And 3D on the web.', 140, 355, lt, 0.5, { size: 72, weight: 900, color: C.orange });
  const tiles = ['WordPress', 'PHP', 'JavaScript', 'jQuery', 'CSS', 'Git', 'Three.js', 'Canvas', 'A-Frame VR', 'Photoshop', 'Illustrator', 'Custom Plugins'];
  const cols = [C.cyan, C.orange, C.yellow, C.cyan, C.pink, C.orange, C.green, C.yellow, C.purple, C.cyan, C.orange, C.pink];
  tiles.forEach((tname, i) => {
    const c = i % 3, r = Math.floor(i / 3);
    const x = 140 + c * 360, y = 430 + r * 130;
    const st = 0.9 + i * 0.09;
    const a = eBack(p(lt, st, st + 0.45));
    if (a <= 0) return;
    ctx.save();
    ctx.translate(x + 165, y + 55); ctx.scale(a, a); ctx.translate(-165, -55);
    ctx.globalAlpha = clamp(a);
    rrect(0, 0, 330, 106, 16); ctx.fillStyle = 'rgba(20,28,60,0.85)'; ctx.fill();
    ctx.strokeStyle = cols[i] + '99'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.arc(40, 53, 10, 0, Math.PI * 2); ctx.fill();

  text(String(i + 1).padStart(2, '0'), W - 330, H / 2 + 80, { size: 130, weight: 900, color: col, align: 'center', alpha: eOut(p(l, 0.1, 0.4)) });
  const out = p(l, 1.75, 2.0);
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(-out * 80, 0);
  // mask-wipe for the headline
  const wk = eOutExpo(p(l, 0, 0.5));
  ctx.save(); ctx.beginPath(); ctx.rect(120, 380, 1300 * wk + 20, 220); ctx.clip();
  const bigSize = Math.min(120, 120 * 1180 / measure(big, 120, 900));
  text(big, 140, 540, { size: bigSize, weight: 900, color: C.white });
  ctx.restore();
  ctx.fillStyle = col; ctx.fillRect(140, 590, 300 * eOut(p(l, 0.2, 0.6)), 8);
  reveal(small, 140, 680, l, 0.35, { size: 46, weight: 600, color: col, stagger: 0.05 });
  ctx.restore();
}
function sGoal(lt) {
  const k = eOutExpo(p(lt, 0, 0.5));
  text('GOAL #1', W / 2, 400, { size: 44, weight: 700, font: MONO, color: C.cyan, align: 'center', ls: 14, alpha: k });
  const k2 = eOutExpo(p(lt, 0.5, 1.1));
  ctx.save(); ctx.translate(W / 2, 570); ctx.scale(lerp(0.6, 1, k2), lerp(0.6, 1, k2));
  text('Keep people happy.', 0, 0, { size: 150, weight: 900, color: C.orange, align: 'center', alpha: k2, glow: 'rgba(255,122,47,0.55)', glowSize: 40 });
  ctx.restore();
  reveal('Clients, teammates, users. Every time.', W / 2, 680, lt, 1.5, { size: 46, weight: 600, color: C.white, align: 'center' });
  // confetti burst
  if (lt > 0.6) {
    const r = rng(1234);
    const tt = lt - 0.6;
    for (let i = 0; i < 90; i++) {
      const ang = r() * Math.PI * 2, sp = 300 + r() * 700;
      const cx = W / 2 + Math.cos(ang) * sp * eOut(clamp(tt / 1.5));
      const cy = 540 + Math.sin(ang) * sp * 0.6 * eOut(clamp(tt / 1.5)) + tt * tt * 90;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(tt * 6 * (r() - 0.5) * 4);
      ctx.globalAlpha = 1 - p(tt, 1.8, 3.2);
      ctx.fillStyle = [C.orange, C.cyan, C.pink, C.yellow, C.green][i % 5];
      ctx.fillRect(-7, -3, 14, 6);
      ctx.restore();
    }
  }
}

// 9. Outro
function sOutro(lt) {
  const k = eOut(p(lt, 0, 1.0));
  ctx.save();
  const g = ctx.createRadialGradient(1450, 560, 50, 1450, 560, 560);
  g.addColorStop(0, 'rgba(255,122,47,0.4)'); g.addColorStop(1, 'rgba(34,211,238,0)');
  ctx.globalAlpha = k; ctx.fillStyle = g; ctx.fillRect(850, 0, 1070, H);
  ctx.restore();
  drawPhoto(lerp(1700, 1460, k), 1100, 960 * (1 + lt * 0.01), k);
  reveal("Let's build", 140, 300, lt, 0.2, { size: 120, weight: 900 });
  reveal('something great.', 140, 430, lt, 0.4, { size: 120, weight: 900, color: C.orange });
  const a = eOut(p(lt, 1.2, 1.8));
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.cyan; ctx.fillRect(140, 490, 520 * a, 4); ctx.restore();
  reveal('JEREMY COINTIN', 140, 580, lt, 1.3, { size: 60, weight: 900, ls: 4 });
  reveal('Web Developer · AI Workflows · St. Louis, MO', 140, 630, lt, 1.5, { size: 32, weight: 500, color: C.dim, stagger: 0.04 });
  const contacts = [['EMAIL', 'jc@stlcodescape.com'], ['WEB', 'stlcodescape.com'], ['PHONE', '(314) 657-7421']];
  contacts.forEach(([l, v], i) => {
    const st = 2.0 + i * 0.25;
    const ca = eOut(p(lt, st, st + 0.5));
    text(l, 140, 750 + i * 72 + (1 - ca) * 20, { size: 24, weight: 700, font: MONO, color: C.cyan, ls: 4, alpha: ca });
    text(v, 290, 750 + i * 72 + (1 - ca) * 20, { size: 44, weight: 700, color: C.white, alpha: ca });
  });
  text('Available nights & weekends. Seriously.', 140, 1010, { size: 28, weight: 500, font: MONO, color: C.dim, alpha: eOut(p(lt, 3.4, 4.0)) });
}

// ---------- timeline ----------
const SCENES = [
  [0, 7, sIntro],
  [7, 15, sWho],
  [15, 25, sJourney],
  [25, 35, sRecord],
  [35, 45, sToolkit],
  [45, 55, sAI],
  [55, 57, sFunTitle],
  [57, 61, sProject(0)],
  [61, 65, sProject(1)],
  [65, 69, sProject(2)],
  [69, 73, sProject(3)],
  [73, 75, sFunTag],
  [75, 85, sTraits],
  [85, 89, sGoal],
  [89, 100, sOutro],
];
const WIPES = [7, 15, 25, 35, 45, 55, 75, 89];

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.setLineDash([]);
  background(t);
  for (const [a, b, fn] of SCENES) {
    if (t < a || t >= b) continue;
    const lt = t - a, dur = b - a;
    const out = p(lt, dur - 0.25, dur);
    ctx.save();
    ctx.globalAlpha = 1 - out;
    if (out > 0) { ctx.translate(W / 2, H / 2); const s = 1 + out * 0.06; ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); }
    fn(lt);
    ctx.restore();
  }
  // diagonal wipe on the big section changes
  for (const b of WIPES) {
    const d = (t - b) / 0.35;
    if (d < -1 || d > 1) continue;
    const x = lerp(-600, W + 600, (d + 1) / 2);
    ctx.save();
    ctx.translate(x, H / 2); ctx.rotate(-0.35);
    ctx.fillStyle = C.orange; ctx.fillRect(-260, -H, 60, H * 2);
    ctx.fillStyle = C.cyan; ctx.fillRect(-200, -H, 400, H * 2);
    ctx.fillStyle = C.white; ctx.fillRect(200, -H, 16, H * 2);
    ctx.restore();
  }
  vignette();
  // fade in / out
  const f = Math.max(1 - p(t, 0, 0.4), p(t, DURATION - 1.6, DURATION));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- playback / render hooks ----------
window.draw = draw;
window.DURATION = DURATION;
window.ready = Promise.all([
  new Promise(r => photo.complete ? r() : (photo.onload = r)),
  document.fonts.load(`900 100px ${DISP}`), document.fonts.load(`700 40px ${DISP}`), document.fonts.load(`400 40px ${MONO}`),
]);
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render');
} else {
  const audio = document.getElementById('music');
  const clock = document.getElementById('clock');
  let start = null, useAudio = false;
  document.getElementById('play').onclick = () => {
    audio.currentTime = 0;
    audio.play().then(() => { useAudio = true; }).catch(() => { useAudio = false; });
    start = performance.now();
  };
  const loop = now => {
    if (start === null) start = now;
    let t = useAudio ? audio.currentTime : ((now - start) / 1000) % DURATION;
    if (useAudio && audio.ended) t = DURATION - 0.01;
    draw(t);
    clock.textContent = t.toFixed(1) + 's';
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
